# RootRecall 主配置
# - 模型用 `use: <module>:<ClassName>` 声明,工厂用反射加载(加 provider 零代码)。
# - 任何以 $ 开头的值会被解析为环境变量(见 .env)。
# 详见 docs/architecture.md §4.1 / §4.2。

models:
  # —— OpenAI ——
  - name: gpt-4.1
    display_name: GPT-4.1
    use: langchain_openai:ChatOpenAI
    model: gpt-4.1
    api_key: $OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 8192
    temperature: 0.2
    supports_vision: true

  # —— DeepSeek(OpenAI 兼容,性价比高)——
  - name: deepseek-v4-pro
    display_name: DeepSeek Chat
    use: langchain_openai:ChatOpenAI
    model: deepseek-v4-pro
    api_key: $DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    max_tokens: 8192
    temperature: 0.2

  # —— DeepSeek Flash(非 reasoning,快;定位/摘要等轻任务用,省时省钱)——
  # locator 三段漏斗(选文件/选函数/选行)是轻任务,用 flash 而非 pro:
  # pro 是 reasoning 重模型,每次首 token 90~150s,7 次串行要 5~10min;
  # flash 非推理,每次 2~5s,7 次 ≈ 30s,且定位够用(对标 Agentless 用 GPT-4o 级)。
  - name: deepseek-v4-flash
    display_name: DeepSeek Flash
    use: langchain_openai:ChatOpenAI
    model: deepseek-v4-flash
    api_key: $DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    max_tokens: 8192
    temperature: 0.2

  # —— Anthropic(需 uv sync --extra providers)——
  # - name: claude-sonnet
  #   display_name: Claude Sonnet
  #   use: langchain_anthropic:ChatAnthropic
  #   model: claude-sonnet-4-5
  #   api_key: $ANTHROPIC_API_KEY
  #   max_tokens: 8192
  #   supports_thinking: true
  #   supports_vision: true
  #   when_thinking_enabled: { thinking: { type: enabled, budget_tokens: 8000 } }
  #   when_thinking_disabled: { thinking: { type: disabled } }

  # —— 本地 Ollama(零成本;用原生 provider 保留 reasoning)——
  # - name: qwen3-local
  #   use: langchain_ollama:ChatOllama
  #   model: qwen3:32b
  #   base_url: http://localhost:11434
  #   num_predict: 8192
  #   supports_thinking: true

# 角色 → 模型 路由。
# 当前所有角色统一走 deepseek-v4-pro(可用 key);后续接入更强模型(Claude / GPT 等)后,
# 再按"便宜模型做摘要、强模型做定位/写作"分层——届时只改这里,零代码。
model_roles:
  default: deepseek-v4-pro
  planner: deepseek-v4-pro
  locator: deepseek-v4-pro   # R2 收尾回退 pro:flash localize 不稳(漏 events.c → delegate timeout);pro 相对稳命中金标准根因。方案A(检索预筛)R3 根治
  summarizer: deepseek-v4-pro
  verifier: deepseek-v4-pro
  memory_extractor: deepseek-v4-pro
  title: deepseek-v4-pro

# 工具分组(声明式;工作流按组挂载工具)。
tool_groups:
  - name: sandbox       # 命令执行
  - name: file:read     # 只读:读文件 / 列目录
  - name: file:write    # 写入:写文件 / 改文件
  - name: code          # 代码导航(grep/read/search/LSP)
  - name: memory        # 记忆:recall 翻历史 / memorize 记一条

# 沙箱 provider + 参数(P0 本地沙箱;P6 换 Docker 时只改 use 即可)。
sandbox:
  use: rootrecall.platform.sandbox.provider:LocalSandboxProvider
  workspace: data/sandbox/workspace
  bash_command_timeout: 600
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

# 代码理解服务(P1 分阶段搭建,见 docs/p1-code-understanding-design.md)。
# P1.2 先配 embedding;vector_store / retrieval / repo_map 随对应阶段补。
code_index:
  # repo: 不再钉默认(2026-08-26):P1.4 时代钉的 rootrecall 是安装根名 = 永远空的作用域
  # (实测 T14:recall 默认探空池盲试)。现在默认链 = env ROOTRECALL_CODEBASE > 这里(不设)
  # > 唯一注册基线(单库机器零配置)> cwd 目录名;多库机器靠近义容错列候选。
  embedding:
    # provider 抽象(像模型工厂):
    #   openai_compatible = 远端 OpenAI 兼容 API(默认;免下载、免 torch,和调 chat 一样配 key)
    #   sentence_transformers = 本地(需 `uv sync --extra embedding-local`;离线 / 数据不出本地)
    provider: openai_compatible
    # —— 远端 OpenAI 兼容(默认:阿里云百炼 DashScope)——
    # 同一份代码,换 base_url + api_key + model 即可切 SiliconFlow / OpenAI / 自建 vLLM。
    # base_url 走 $ENV:专属 MaaS 端点(如 llm-xxxx.cn-beijing.maas.aliyuncs.com)在 .env 配
    # DASHSCOPE_BASE_URL;不设则 create_embedder 回落 serverless 黉认 dashscope.aliyuncs.com。
    base_url: $DASHSCOPE_BASE_URL
    api_key: $DASHSCOPE_API_KEY
    model: text-embedding-v4          # = Qwen3-Embedding 全血版(质量优于本地 0.6B)。换 SiliconFlow:Qwen/Qwen3-Embedding-0.6B 或 BAAI/bge-m3
    dimensions: 1024                  # 输出维度(Qwen3 系列可调 64-2048;bge-m3 不支持此参数、固定 1024)。存取必须同 dim。
    batch_limit: 10                   # 远端每请求文本条数上限(DashScope v4=10;SiliconFlow 更宽)。embed_chunks 自动分批。
    normalize: true                   # 客户端 L2 归一化(API 返回未必归一化,显式做保 cosine 一致)
    # —— 本地 sentence_transformers 模式(provider 改它时才生效)——
    # local_model: Qwen/Qwen3-Embedding-0.6B
    # max_seq_length: 8192            # ⚠️ 本地必须显式设(ST 默认 512 会静默截断长代码)
    # device: cpu                     # cuda / mps
    # hf_endpoint: https://hf-mirror.com
    # query_instruction: query        # Qwen3 用 prompt_name="query";bge-m3 留空

  # 检索(P1.3 retrieval.py):LanceDB 原生 hybrid(BM25 FTS + 稠密向量)+ RRF 融合 + reranker 重排。
  retrieval:
    rrf_k: 60                          # Cormack 2009 标准,跨 80+ 实验近最优,几乎不用调
    candidate_top_n: 50                # 喂 reranker 的候选池(hybrid 取 top-50)
    final_top_k: 5                     # reranker 后最终返回
    fts_stem: false                    # 代码场景必须关(否则 malloc 等 token 被 stem 乱变)
    fts_remove_stop_words: false       # 代码场景必须关(否则 int/void/public/return 被当英文停用词删掉)
    query_boost: true                  # 查询类型 boosting(PascalCase→Class / snake→Function / dotted→qualified)

  # 重排(P1.3 retrieval.py):provider 抽象,镜像 embedding。默认远端(CPU 本地 257s/100doc 不可交互)。
  # live 测确认:DashScope rerank 走「原生端点」(非 OpenAI 兼容面,compatible-mode/v1/reranks 是 404)。
  reranker:
    provider: dashscope                # dashscope(原生,默认)| siliconflow(Cohere 形态,免费)| sentence_transformers(本地,GPU)| off
    # base_url 走 $ENV:专属 MaaS 端点在 .env 配 DASHSCOPE_RERANK_URL;不设则 create_reranker 回落 serverless 默认。
    base_url: $DASHSCOPE_RERANK_URL
    api_key: $DASHSCOPE_API_KEY        # 与 embedding 同一个 key
    model: qwen3-rerank                # 100+ 语言;¥0.0005/千token(同 embedding 价,≈8 万次查询=¥1)
    rerank_top_n: 5
    # fallback(siliconflow 免费,需 $SILICONFLOW_API_KEY):provider: siliconflow, base_url: https://api.siliconflow.cn/v1/rerank, model: BAAI/bge-reranker-v2-m3

  # L2 精确导航(P1.5 lsp.py):clangd 经 multilspy 驱动。caller/callee(查找引用)、跳定义、hover。
  # 硬前提:仓库根有 compile_commands.json(autotools 用 `bear -- make V=1` 或 `compiledb --parse make -nW V=1`;
  # cmake 用 `cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON`)。没有它 references 质量骤降(见设计文档 §5.7 降级)。
  lsp:
    clangd_path: null          # null = shutil.which("clangd") 自动找;或写绝对路径(如 /usr/bin/clangd)
    extra_args: []             # 追加 clangd flag(如交叉编译 ["--query-driver=/usr/bin/arm-linux-gnueabihf-gcc*"])
    start_timeout: 30          # 起 clangd + initialize 超时(秒)
    request_timeout: 15        # 单次 references/definition/hover 超时(秒)
    index_retry: 1             # 结果为空/偏少时重试次数(防后台索引未就绪)
    index_retry_delay: 0.3     # 重试间隔(秒)
    compile_commands_dir: null # null = clangd 自动从源文件向上找;或写绝对路径强制指定 compile_commands.json 所在目录

# 记忆核心(R1,★P3 差异化):MemoryService 契约 + 可换后端(见 docs-bak/设计/memory-design.md)。
# v1 默认 native —— 组合已有 code_index(语义)+ code-review-graph(结构,可选),不建第三个检索栈。
# 切后端 = 丢 backends/<name>/ 文件夹 + 改 backend 名;mem0/cognee 作可选 extra(零锁死)。
memory:
  backend: native                # native(v1)| mem0 | cognee | 'pkg.mod:Cls'(各自实现 backends/<name>/)
  store_path: data/memory        # native SQLite 落点(知识项 canonical 记录 + FTS5 检索 + 向量 blob)
  native:
    structural: none             # none(默认,不接结构图)| crg(接 code-review-graph;需 `uv sync --extra code-review-graph`)
    embed: code_index            # code_index(复用 code_index 的 embedder 给 KI summary 算向量)| off(只 BM25)
    rerank: code_index           # code_index(复用 code_index 的 reranker 精排 recall)| off(只 RRF 融合)
    recall_top_k: 5              # recall 默认返回条数
    decay_halflife_days: 180.0   # 衰减半衰期(天)—— 简单 exp(-age/halflife);Weibull 留 backlog(mnemopi 也未启用)
    promote_access_count: 3      # 被召回≥N 次 → 升级 mental_model(Letta 3+ 规则)
    merge_step: 0.3              # 重提时 Bayes 置信度累加步长(mnemopi veracity 0.3)

# 委托(R2,★P2 MVP):把 bug-RCA 的「读码 / 写补丁 / 给根因」重活委托给成熟 coding agent。
# 抽象接口 CodingAgentDelegate(见 src/rootrecall/tools/delegate.py);v1 默认 opencode。
# 调研定稿(2026-07-29):本机 omp 未装(github 墙 + bun),opencode v1.18.3 已装、
# run --format json 事件流天然绕开「DeepSeek 思考模式不支持结构化产出」坑。完整理由见
# docs/调研/r2-bug-rca-research.md §1-2。
# 流程:opencode run --format json --auto --dir <repo> "<prompt>" → 解析 NDJSON 事件流
#       → 取最后一条 assistant 文本 → 喂 JSON Schema 抠对象(复用 memory/extract.py 方案)。
# 反向:opencode 原生 MCP client 挂 `rootrecall mcp serve`,外勤现场查 RootRecall 记忆(§6)。
delegate:
  backend: opencode             # opencode(v1 默认,本机已装)| omp(需 bun)| claude(需 claude CLI)
  max_localize_loops: 2         # R3.1 B 迭代 verify-refine:localize 阶段最多自审重定位几轮(iter0 + K1-1)
  max_repair_loops: 2           # R3.1 B:repair 阶段最多自审重修几轮
  opencode:
    bin: opencode               # 可执行文件名;或写绝对路径
    model: uniontech-ai/glm-5.2  # flash 弱模型做复杂 RCA 收敛不了(600s timeout);换 glm-5.2 强档。格式 "provider/model"
    agent: null                 # null = opencode 默认 agent(本机 Sisyphus);或指定子 agent 名
    variant: null               # null = 默认;"high"|"max"|"minimal"(provider 推理档;对齐 T2L「Medium 最佳」)
    auto_approve: true          # 无头必须(--auto):自动批准未显式拒绝的权限
    format: json                # json(NDJSON 事件流,默认)| default(格式化文本)
    timeout: 1200               # 委托总超时(秒);复杂 C RCA + 写补丁需久,600 不够 flash 收敛
    config: config/opencode_rootrecall.json  # RootRecall 自带 opencode 配置(rootrecall-localize/repair agent + steps 限轮 + permission 工具白名单);env OPENCODE_CONFIG 注入
    retry_max: 2               # 瞬时网络错(connection reset)重试次数 —— glm API 偶发 reset,delegate 自动续 session 重试(每模型最多跑这么多次)
    fallback_model: uniontech-ai/deepseek-v4-flash  # 主模型(glm-5.2)重试仍瞬时错 → 换 flash(非推理、调用快 2-5s、reset 概率低;同 provider 无需新 key)
  omp:                          # 备选(本机暂未装;网络/bun 通了切回 —— 其 strict schema 强校验是最大价值)
    bin: omp
    mode: rpc                   # rpc(NDJSON 流,推荐)| print(-p 纯文本兜底)
    auto_approve: true          # 等价 --yolo
    timeout: 600
  claude:                       # 备选(需另装 claude CLI;可选高档后端)
    bin: claude
    timeout: 600

# ── agent 运行时 harness(R3)─────────────────────────────────────────
# 面向小白:RootRecall 自己的 lead agent(深度调研那种长 agent)跑起来的护栏——
# 断点续跑(checkpointer)+ token 预算闸(防烧爆)+ 工具输出外化(防单次工具返回撑爆上下文)。
# 对标 deer-flow harness(自建 runtime,coding 活仍委托 opencode)。设计见 docs-bak/设计/runtime-harness-design.md。
# R3.0:runtime 只驱动 checkpointer(checkpoint.py 读 checkpoint_backend/path);
#       token_budget/tool_output 子配置是声明式(中间件 R3.0 用默认值,CLI 启动时再 wire)。
runtime:
  enabled: true                 # runtime 总开关
  checkpoint_backend: sqlite    # memory(内存,仅测)| sqlite(持久,默认,断点续跑)| postgres(R5)
  checkpoint_path: null         # null → 默认 data/runtime/checkpoint.sqlite
  token_budget:                 # 每 run token 预算(超软警告→塞「快收尾」;超硬停→剥 tool_calls 自然停)
    max_tokens: 1000000         # 总 token 上限(input+output)
    max_input_tokens: null      # 可选:单限 input
    max_output_tokens: null     # 可选:单限 output
    warn_threshold: 0.7
    hard_stop_threshold: 1.0
  tool_output:                  # 工具输出外化(超阈值写盘 + synopsis 摘要;模型需要细节 read_file 取)
    externalize_min_chars: 30000
    outputs_dir: data/runtime/tool-outputs

# ── MCP 对外暴露(harness 转向 D0)─────────────────────────────────────
# 面向小白:RootRecall 把自己的能力(记忆/代码检索/日志/影响面/补丁验证)做成 MCP 工具,
# 给别的 coding agent(opencode 主 / codex / claude code)调。这层控制怎么"开门":
#   stdio(默认)= 每次 agent 拉起一个子进程,本地最简(delegate 老路径用它);
#   http = 一个长期开着的 warm 进程,所有 agent 共用,省掉每修一个 bug 都重启加载
#          ~1.2GB(sentence-transformers)的冷启动(= 解掉老 ③ 号 cold-boot 痛)。
# CLI `rootrecall mcp serve --transport http --host --port` 覆盖这里的默认值。
# 用 http:先 `rootrecall mcp serve --transport http` 跑起来,再把 opencode/codex 指向
#        http://<host>:<port>/mcp(端点路径 /mcp 是 FastMCP 默认 streamable_http_path)。
mcp:
  transport: stdio            # stdio(默认)| http(streamable-http)
  host: 127.0.0.1             # http 绑定地址(本机;对外暴露改 0.0.0.0 + 鉴权留 R4/R5)
  port: 8765                  # http 端口

# ── 补丁/PR 分析(P-A,harness 转向后第二条 tool+skill 线)─────────────────
# 面向小白:bug-RCA 是"从 bug 找补丁";P-A 反过来 —— "给个补丁/PR,验它对不对、该不该合"。
# 这层只管一件后勤:缺代码仓时按你给的地址自动 clone(patch.git)。验证封顶 = apply,
# **不跑测试不复现**(系统软件测试/构建环境太重,用户定)→ 结论是"apply 过、看着靠谱",非"包对",
# 最终拍板靠人/真机。build_check 试编译门 2026-08-10 撤(踩坑#14:构建信号歧义 + opencode 能 make)。
patch:
  git:
    clone_dir: data/repos     # auto-clone 落点(ensure_repo 命中这里就不再 clone,幂等)
    shallow: true             # --depth 1 浅克隆(省时省空间;要完整历史改 false)
    remotes: {}               # {仓库名: git url} —— 你的"自定义 git 连接"(内网镜像/SSH),如 {bluez: https://...}

# ── opencode 宿主桥接(2026-08-28;chat 模型复用宿主 url/key,key 不落盘)──────────────
# 机器上已配好 opencode 的话,chat 模型不用再配一份 key:
#   uv run rootrecall opencode-models                 # 探测宿主可派生的模型(key 只验存在)
#   uv run rootrecall opencode-models --adopt <provider>/<model>   # 采纳 → 在本文件末尾生成
#   # models_from_opencode: 标记段(只有 provider/model/name,key 运行时从宿主 auth.json 读)
# embedding/reranker 不从宿主读(宿主 chat provider 多半无 /embeddings;向量空间锁死 provider)。
